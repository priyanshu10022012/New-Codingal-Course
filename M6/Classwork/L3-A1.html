<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <title>Portfolio</title>
</head>

<body style="background-color: #222;">

    <div id="social-media" class="container-fluid">
        <div class="container text-white py-5">
            <h4 class="text-warning">Social Media</h4>
            <h1>Let's be friends</h1>
            <div class="row pt-5">

                <!-- LinkedIn -->
                <div class="col-3 media_link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">LinkedIn</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-start">
                            <a href="#" class="text-secondary">
                                <i class="fab fa-linkedin fa-2x"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- GitHub -->
                <div class="col-3 media_link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">GitHub</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-start">
                            <a href="#" class="text-secondary">
                                <i class="fab fa-github fa-2x"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- YouTube -->
                <div class="col-3 media_link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">YouTube</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-start">
                            <a href="#" class="text-secondary">
                                <i class="fab fa-youtube fa-2x"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="col-3 media_link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">Email</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-start">
                            <a href="mailto:youremail@example.com" class="text-secondary">
                                <i class="fa fa-envelope fa-2x"></i>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
